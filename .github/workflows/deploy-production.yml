name: Deploy production

on:
  push:
    branches: [production]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Create Vercel production deployment (skip-domain)
        id: deploy
        run: |
          deployment_url=$(npx vercel@54.0.0 deploy \
            --prod \
            --skip-domain \
            --yes \
            --scope=start-berlin)
          [[ "$deployment_url" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify production deployment commit
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "${{ steps.deploy.outputs.url }}/api/health" | \
            jq --exit-status --arg commit "$GITHUB_SHA" '.ok == true and .commit == $commit'

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply production database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Promote production deployment
        run: |
          npx vercel@54.0.0 promote \
            "${{ needs.build.outputs.url }}" \
            --yes \
            --timeout=5m \
            --scope start-berlin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify production domain commit
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://cockpit.start-berlin.com/api/health" | \
            jq --exit-status --arg commit "$GITHUB_SHA" '.ok == true and .commit == $commit'

      - name: Sync Inngest production
        run: |
          curl --fail -X POST "https://api.inngest.com/v2/apps/$INNGEST_APP_ID/syncs" \
            -H "Authorization: Bearer $INNGEST_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"$INNGEST_APP_URL\"}"
        env:
          INNGEST_API_KEY: ${{ secrets.INNGEST_API_KEY_PROD }}
          INNGEST_APP_ID: ${{ secrets.INNGEST_APP_ID_PROD }}
          INNGEST_APP_URL: https://cockpit.start-berlin.com/api/inngest
