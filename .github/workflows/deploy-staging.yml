name: Deploy staging

on:
  push:
    branches: [main]

concurrency:
  group: staging-db-app-inngest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Pull Vercel preview configuration
        run: |
          npx vercel@54.0.0 pull \
            --environment=preview \
            --git-branch="$GITHUB_REF_NAME" \
            --yes \
            --scope=start-berlin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel preview
        run: npx vercel@54.0.0 build --target=preview --yes --scope=start-berlin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Prebuilt builds do not receive Vercel's Git system variables.
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

      - name: Apply staging database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

      - name: Deploy prebuilt Vercel preview
        id: deploy
        run: |
          deployment_url=$(npx vercel@54.0.0 deploy \
            --prebuilt \
            --target=preview \
            --yes \
            --scope=start-berlin)
          [[ "$deployment_url" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify preview deployment commit
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "${{ steps.deploy.outputs.url }}/api/health" | \
            jq --exit-status --arg commit "$GITHUB_SHA" '.ok == true and .commit == $commit'

      - name: Assign staging domain
        run: |
          npx vercel@54.0.0 alias set \
            "${{ steps.deploy.outputs.url }}" \
            staging.cockpit.start-berlin.com \
            --scope start-berlin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify staging domain commit
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://staging.cockpit.start-berlin.com/api/health" | \
            jq --exit-status --arg commit "$GITHUB_SHA" '.ok == true and .commit == $commit'

      - name: Sync Inngest staging
        run: |
          curl --fail -X POST "https://api.inngest.com/v2/apps/$INNGEST_APP_ID/syncs" \
            -H "Authorization: Bearer $INNGEST_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"$INNGEST_APP_URL\"}"
        env:
          INNGEST_API_KEY: ${{ secrets.INNGEST_API_KEY_STAGING }}
          INNGEST_APP_ID: ${{ secrets.INNGEST_APP_ID_STAGING }}
          INNGEST_APP_URL: https://staging.cockpit.start-berlin.com/api/inngest
